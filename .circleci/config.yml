version: 2.1

parameters:
  build-wheels:
    type: boolean
    default: false

jobs:
  rust-checks:
    docker:
      - image: cimg/python:3.13
    steps:
      - checkout
      - run:
          name: Install Rust and run Rust checks
          command: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable --component rustfmt,clippy
            export PATH="$HOME/.cargo/bin:$PATH"
            export RUSTDOCFLAGS='-D warnings'
            cargo +stable test --locked
            cargo +stable fmt --check
            cargo +stable clippy --features python --all-targets --locked -- -D warnings
            cargo +stable doc --no-deps --locked
      - run:
          name: Test script and benchmark entry points
          command: python3 -m unittest discover -s scripts -p 'test_*.py'

  python-checks:
    docker:
      - image: cimg/python:3.10
    steps:
      - checkout
      - run:
          name: Build distribution wheel
          command: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.91.0
            export PATH="$HOME/.cargo/bin:$PATH"
            export RUSTUP_TOOLCHAIN=1.91.0
            python -m pip install 'maturin>=1.9,<2'
            maturin build --release --locked --out dist --interpreter python
      - run:
          name: Test clean installed wheel
          command: |
            python -m venv /tmp/wheel-env
            /tmp/wheel-env/bin/python -m pip install dist/*.whl
            /tmp/wheel-env/bin/python scripts/smoke-installed.py
            for wheel in dist/*.whl; do
              /tmp/wheel-env/bin/python -m pip install "$wheel[test]"
            done
            /tmp/wheel-env/bin/python -m pytest python/tests -q
            /tmp/wheel-env/bin/python -m mypy

  linux-wheels:
    parameters:
      resource:
        type: string
    machine:
      image: ubuntu-2404:current
    resource_class: << parameters.resource >>
    steps:
      - checkout
      - run:
          name: Build and test Linux wheels
          command: |
            python3 -m venv /tmp/wheel-tools
            /tmp/wheel-tools/bin/python -m pip install cibuildwheel==4.3.5
            /tmp/wheel-tools/bin/python -m cibuildwheel --platform linux --output-dir wheelhouse
      - persist_to_workspace:
          root: wheelhouse
          paths: ["*.whl"]
      - store_artifacts:
          path: wheelhouse

  macos-wheels:
    macos:
      xcode: "16.4.0"
    resource_class: m4pro.medium
    steps:
      - checkout
      - run:
          name: Set up Python and Intel emulation
          command: |
            softwareupdate --install-rosetta --agree-to-license
            brew install python@3.13
      - run:
          name: Build and test macOS wheels
          command: |
            "$(brew --prefix python@3.13)/bin/python3.13" -m venv /tmp/wheel-tools
            /tmp/wheel-tools/bin/python -m pip install cibuildwheel==4.3.5
            /tmp/wheel-tools/bin/python -m cibuildwheel --platform macos --output-dir wheelhouse
      - persist_to_workspace:
          root: wheelhouse
          paths: ["*.whl"]
      - store_artifacts:
          path: wheelhouse

  distributions:
    docker:
      - image: cimg/python:3.13
    steps:
      - checkout
      - attach_workspace:
          at: dist
      - run:
          name: Build and test the source distribution
          command: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.91.0
            export PATH="$HOME/.cargo/bin:$PATH"
            export RUSTUP_TOOLCHAIN=1.91.0
            python -m pip install 'maturin>=1.9,<2' 'twine>=6.1,<7'
            maturin sdist --out dist
            python -m venv /tmp/source-env
            /tmp/source-env/bin/python -m pip install --config-settings build-args=--locked dist/*.tar.gz
            /tmp/source-env/bin/python scripts/smoke-installed.py
      - run:
          name: Validate the complete release set
          command: |
            version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
            python scripts/check_distributions.py dist "$version" "${CIRCLE_TAG:-}"
            python -m twine check --strict dist/*
      - persist_to_workspace:
          root: dist
          # Wheels are already in the shared workspace from their build jobs.
          paths: ["*.tar.gz"]
      - store_artifacts:
          path: dist

  publish-pypi:
    docker:
      - image: cimg/python:3.13
    steps:
      - attach_workspace:
          at: dist
      - run:
          name: Publish validated distributions to PyPI
          command: |
            python -m pip install 'twine>=6.1,<7'
            python -m twine upload --non-interactive dist/*

workflows:
  ci:
    when:
      not: << pipeline.parameters.build-wheels >>
    jobs:
      - rust-checks
      - python-checks

  wheels:
    when:
      or:
        - << pipeline.parameters.build-wheels >>
        - matches:
            pattern: "^v[0-9]+\\.[0-9]+\\.[0-9]+.*$"
            value: << pipeline.git.tag >>
    jobs:
      - linux-wheels:
          name: linux-wheels-<< matrix.resource >>
          matrix:
            alias: linux-wheel-builds
            parameters:
              resource: [medium, arm.medium]
          filters:
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+.*$/
      - macos-wheels:
          filters:
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+.*$/
      - distributions:
          requires:
            - linux-wheel-builds
            - macos-wheels
          filters:
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+.*$/
      - publish-pypi:
          context: pypi
          requires:
            - distributions
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+.*$/
