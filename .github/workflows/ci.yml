name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Test, format and lint
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo +stable test --locked
          cargo +stable fmt --check
          cargo +stable clippy --features python --all-targets --locked -- -D warnings
          cargo +stable doc --no-deps --locked
      - name: Test script and benchmark entry points
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  python:
    name: Installed Linux wheel / Python 3.10
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      - name: Build distribution wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: x86_64
          manylinux: '2_28'
          rust-toolchain: '1.91.0'
          args: --release --locked --out dist --interpreter python3.10
      - name: Test clean installed wheel
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/python -m pip install dist/*.whl
          /tmp/wheel-env/bin/python scripts/smoke-installed.py
          for wheel in dist/*.whl; do
            /tmp/wheel-env/bin/python -m pip install "$wheel[test]"
          done
          /tmp/wheel-env/bin/python -m pytest python/tests -q
          /tmp/wheel-env/bin/python -m mypy
      - name: Check source distribution installation
        if: github.event_name == 'workflow_dispatch'
        run: |
          rustup toolchain install 1.91.0 --profile minimal
          python -m pip install 'maturin>=1.9,<2'
          maturin sdist --out dist
          python -m venv /tmp/source-env
          RUSTUP_TOOLCHAIN=1.91.0 /tmp/source-env/bin/python -m pip install dist/*.tar.gz
          /tmp/source-env/bin/python scripts/smoke-installed.py
